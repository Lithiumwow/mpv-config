# Options for scripts/hdr-mode.lua (requires scripts/display-info.dll)
# https://github.com/dyphire/mpv-display-plugin
# https://github.com/dyphire/mpv-scripts/blob/main/hdr-mode.lua
#
# hdr_mode values:
#   noth   - do nothing (default)
#   pass   - when the monitor is already in HDR mode, pass through HDR content
#   switch - automatically toggle Windows HDR based on the video content
hdr_mode=noth

# Only auto-switch HDR when fullscreen or maximized (hdr_mode=switch only)
fullscreen_only=no

# Target peak in nits. 0 = use user-data/display-info/max-luminance from the plugin
target_peak=0

# Display contrast. auto = derive from user-data/display-info/min-luminance
# Use inf for OLED infinite contrast
target_contrast=auto
